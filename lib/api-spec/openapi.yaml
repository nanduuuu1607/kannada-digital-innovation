openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tutor
    description: AI-assisted Kannada tutoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/tutor:
    post:
      operationId: askKannadaTutor
      tags: [tutor]
      summary: Ask the Kannada tutor for help
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorInput"
      responses:
        "200":
          description: Tutor response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorReply"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Tutor is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TutorInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        context:
          type: string
          maxLength: 300
      required: [message, level]
    TutorReply:
      type: object
      properties:
        answer:
          type: string
        source:
          type: string
          enum: [gemini, sample]
      required: [answer, source]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

